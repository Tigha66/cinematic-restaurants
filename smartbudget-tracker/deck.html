  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; }

      font-family: 'Inter', -apple-system, sans-serif; 
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;

    .deck-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .slide {
      width: 1280px;
      height: 720px;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 80px rgba(0,0,0,0.4);
    }
    .nav {
      display: flex;
      gap: 16px;
      margin-top: 24px;
    }
    .nav button {
      padding: 12px 24px;
      background: #334155;
      color: #fff;
      border: none;
      borderRadius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .nav button:hover { background: #475569; }
    .slide-num {
      position: absolute;
      bottom: 24px;
      right: 32px;
      font-size: 14px;
      color: #94a3b8;

  </style>
</head>

            </h2>

              {[

    function Deck() {
      const [current, setCurrent] = useState(0);

      return (
        <div className="deck-container">
          <div className="slide">
            {slides[current].render}
            <span className="slide-num">{current + 1} / {slides.length}</span>
          </div>
          <div className="nav">
            <button onClick={() => setCurrent(Math.max(0, current - 1))}>← Previous</button>
            <button onClick={() => setCurrent(Math.min(slides.length - 1, current + 1))}>Next →</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Deck />);

</html>
